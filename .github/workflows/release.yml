name: Build and Release

on:
  push:
    tags:
      - 'v*' # Aciona apenas quando uma tag como v0.1.0 é criada

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            ext: ""
          - os: windows-latest
            arch: amd64
            ext: ".exe"
          - os: macos-latest
            arch: amd64
            ext: ""
          - os: macos-latest
            arch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        run: |
          GOOS=$(echo ${{ matrix.os }} | sed 's/ubuntu/linux/; s/macos/darwin/')
          GOARCH=${{ matrix.arch }}
          go build -ldflags="-s -w" -o discord-compress-${GOOS}-${GOARCH}${{ matrix.ext }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: discord-compress-${{ matrix.os }}-${{ matrix.arch }}
          path: discord-compress-*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
